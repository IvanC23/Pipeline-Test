name: CI

on:
  # Direct pushes to development: only the fast checks that need neither
  # Unity nor its license (static checks and the secret scan of the pushed
  # commits), so development is not slowed down. Informative: nothing is
  # blocked by a push. The Unity jobs are skipped (see their "if").
  push:
    branches: [development]
  # Pull requests towards test and main: every check, required on both
  # promotions. Job names are the names of the required checks in the
  # rulesets: keep them stable.
  pull_request:
    branches: [test, main]
  # Manual full run from the Actions tab (Run workflow, any branch), e.g. to
  # check compilation and tests on development before opening a pull
  # request. Everything runs except the secret scan, which has no "new
  # commits" to scan. The button appears once this file is on main.
  workflow_dispatch:

# Least privilege by default: jobs can only read the repository.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA, with the version as a
# comment: a tag can be moved to other code, a commit cannot. The inventory
# job reads both. To update: resolve the new tag to its commit
# (git ls-remote --tags https://github.com/<owner>/<repo>) and change both.
#
# Runners: ubuntu-latest, kept up to date by GitHub; the inventory job records
# the exact runner image of every run. Only unity-tests keeps a fixed label
# (see the comment there).

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Event data is passed through env, never interpolated into the script,
      # so a crafted branch name cannot inject shell commands.
      - name: Show event context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Pull request from $HEAD_REF to $BASE_REF"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run on $REF_NAME"
          else
            echo "Push to $REF_NAME"
          fi

  # Blocking: a spelling error in C# code fails the job.
  # Required check in the test and main rulesets: keep the job name.
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          files: |
            Assets/**/*.cs
          # Check every file, not only the ones changed by the push or PR.
          incremental_files_only: false
          strict: true
          inline: error

  # Blocking: every requirement id used by a test, and every id of the
  # catalog, must have the format PREFIX-nn with an allowed prefix, and the
  # ids used by tests must be in the catalog. Static check on the sources,
  # without Unity: fails in seconds, also when the project does not compile.
  # Required check in the test and main rulesets: keep the job name.
  requirement-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python 3 is preinstalled on the runner; the script uses only the
      # standard library.
      - name: Check requirement ids
        run: >-
          python3 .github/scripts/check_requirement_ids.py
          --requirements Requirements/requirements.json
          --sources Assets

  # Blocking on pull requests: fails when a commit of the pull request adds a
  # secret (token, API key, password). Required check in the test and main
  # rulesets: keep the job name.
  # Also on pushes to development, on the pushed commits only: in a private
  # repository a secret found right after the push can be revoked before it
  # spreads to test, builds and other clones. There it does not block
  # anything (the push has already happened): a red run is the alert.
  # Only the new changes are scanned (the patches of the commits between the
  # base and the head of the pull request, or between the previous and the
  # new head of the pushed branch), never the whole history: the time depends
  # on the size of the change, not of the project. A secret added and removed
  # inside the same pull request is still found, because every commit is
  # scanned, not only the final result.
  # The official gitleaks binary is used instead of gitleaks-action: the
  # action needs a license key on organization repositories, the binary
  # (MIT) behaves the same on personal and organization repositories.
  secret-scan:
    # A manual run has no new commits to scan.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # To update: take the new version from the gitleaks releases page and
      # the sha256 of gitleaks_<version>_linux_x64.tar.gz from the
      # gitleaks_<version>_checksums.txt file of the same release.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full commit graph (fetch-depth 0) but no file contents (blob:none):
      # git downloads only the contents the scanned patches need.
      # The sparse checkout keeps the working tree to the root files and
      # .github, where .gitleaksignore lives: no need for the whole project.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      # The archive is verified against the pinned checksum before use:
      # a different or altered download stops the job.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Pull request: base..head = the commits of the pull request only.
      # Push: before..after = the commits of the push only. A push that
      # creates the branch has no previous head (all zeros): only the pushed
      # commit is scanned.
      # --redact: the secret is never printed in the log or in the report.
      # --ignore-gitleaks-allow: an inline "gitleaks:allow" comment cannot
      # silence a finding; accepted false positives go in .gitleaksignore,
      # a file reviewed in the pull request like any other change.
      - name: Scan the new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -z "${PUSH_BEFORE_SHA//0/}" ]; then
            range="-1 ${PUSH_HEAD_SHA}"
          else
            range="${PUSH_BEFORE_SHA}..${PUSH_HEAD_SHA}"
          fi
          echo "Scanning commits: ${range}"
          # $range is split on purpose: "-1 <sha>" is two git log arguments.
          git log --oneline $range
          "$RUNNER_TEMP/gitleaks" git \
            --no-banner --verbose --redact --ignore-gitleaks-allow \
            --log-opts="${range}" \
            --report-format sarif --report-path gitleaks-report.sarif \
            .

      # Evidence of the scan, also when it fails (secrets are redacted).
      - name: Upload the scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: warn

  # Informative: spelling errors in documentation and localization files are
  # reported as warnings, the job stays green. Not a required check.
  # Only the listed folders are checked, to skip unrelated .txt files.
  spellcheck-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          files: |
            *.md
            Assets/Resources/**/*.txt
          incremental_files_only: false
          strict: false
          inline: warning

  # Blocking: compiles the Unity project and runs the automated tests.
  # Required check in the test and main rulesets: keep the job name.
  # Compilation (S06) is covered here: the test runner opens the project in
  # batch mode and compiles every assembly before running the tests, so a
  # compile error fails this job. The player build comes later, with the
  # versioned build artifact.
  # Not on pushes to development: the slow Unity jobs (this one and the two
  # that read its results) run on pull requests and on manual runs only.
  # Static analysis with the Roslyn analyzers also runs here, inside the
  # Unity compilation, so it moves to pull requests too.
  unity-tests:
    if: github.event_name != 'push'
    # Pinned runner: the image the editor runs in is fixed by the Unity
    # version, the host is fixed here, so results do not change when
    # ubuntu-latest moves to a new release. A new Ubuntu release is adopted
    # on purpose, with a full test run, before GitHub retires this label.
    runs-on: ubuntu-24.04
    # Every run activates the Unity license at the start and returns it at the
    # end. One run at a time across the repository keeps the activations
    # within the seats of the license (a manual run and a pull request, or
    # two pull requests, would otherwise activate twice at once).
    concurrency:
      group: unity-license
      cancel-in-progress: false
    permissions:
      contents: read
      # Lets the test runner publish the "Unity test results" check run.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails before starting Unity: ignoring failing log messages would hide
      # unexpected errors logged during the tests.
      - name: Reject LogAssert.ignoreFailingMessages = true
        run: |
          if grep -rnE --include='*.cs' 'ignoreFailingMessages[[:space:]]*=[[:space:]]*true' Assets; then
            echo "::error::LogAssert.ignoreFailingMessages = true is not allowed: expect each log message with LogAssert.Expect instead."
            exit 1
          fi
          echo "No forbidden LogAssert settings found."

      # The Library folder holds the imported assets: restoring it avoids a
      # full reimport on every run. A partial match from restore-keys is still
      # faster than an empty folder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # The editor version is read from ProjectSettings/ProjectVersion.txt.
      # License and account come from the repository secrets.
      # Exact versions: since v4.4.0 the action downloads the game-ci CLI and,
      # with cliVersion "latest", asks the GitHub API for its newest release
      # without a token. The unauthenticated limit is shared by every job on
      # the runner IP and can fail the step with HTTP 403. A pinned CLI skips
      # that call and keeps runs reproducible; update both versions on purpose.
      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # No code coverage for now: the coverage package is not installed,
          # so the instrumentation only slows the tests down and produces
          # nothing. Set through the CLI environment variable, not through
          # the coverageEnabled input: action v4.4.0 turns that input into
          # --no-coverageEnabled, which CLI v0.1.76 rejects as an unknown
          # argument. The CLI reads every option also from GAME_CI_<NAME>.
          GAME_CI_COVERAGE_ENABLED: "false"
        with:
          cliVersion: v0.1.76
          # All = EditMode and PlayMode (scene smoke tests), one folder per
          # mode under artifactsPath. Standalone is not included.
          testMode: All
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      # The XML report is kept also when tests fail: it is the evidence of the
      # run and the input of the requirements matrix.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unity-test-results
          # Same folder as artifactsPath above; a fixed path also works when
          # the test step stops before setting its outputs.
          path: test-results
          if-no-files-found: warn

      # Third-party inventory: the Docker image really pulled for Unity and
      # the licenses of the packages in Library/PackageCache exist only in
      # this job. Recorded in under a second, also when the tests fail.
      - name: Record the Unity environment
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/third_party_inventory.py unity-environment --output unity-environment

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: unity-environment
          path: unity-environment
          if-no-files-found: warn

  # Traceability: builds the requirements matrix (requirement -> tests ->
  # outcome) from the XML reports of unity-tests and the catalog in
  # Requirements/requirements.json. Fails when a requirement has no tests,
  # when its tests did not run, or when there is no report at all. A failed
  # test is shown in the matrix; unity-tests already fails on it.
  # A separate job, so it can be re-run alone without starting Unity again.
  # Required check in the test and main rulesets: keep the job name.
  requirements-matrix:
    needs: unity-tests
    # Also after a failure of unity-tests: the matrix shows what failed, or
    # reports the missing XML. Not when the run is cancelled. Not on pushes:
    # unity-tests is skipped there, and !cancelled() alone would still start
    # this job, which would then fail for the missing report.
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # When unity-tests stops before writing any report, the artifact does
      # not exist: the step is allowed to fail and the script reports the
      # missing XML as the error.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: unity-test-results
          path: test-results

      # Python 3 is preinstalled on the runner; the script uses only the
      # standard library.
      - name: Build the requirements matrix
        env:
          # On pull requests github.sha is a temporary merge commit: the
          # matrix refers to the head commit of the branch instead.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/requirements_matrix.py
          --requirements Requirements/requirements.json
          --results test-results
          --output requirements-matrix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: requirements-matrix
          path: requirements-matrix
          if-no-files-found: warn

  # Evidence, not a check: lists every third-party component (actions,
  # tools, Unity Editor and packages, Docker image, binaries, dictionaries,
  # runner images) with its exact version, extracted from the files that
  # decide it, and its license (read from the component when possible,
  # otherwise from .github/third-party-licenses.json; an unknown license
  # only gives a warning). Not a required check.
  # Waits for unity-tests only to read the Docker image it used; it then
  # runs in parallel with requirements-matrix and takes a few seconds.
  third-party-inventory:
    needs: unity-tests
    # Not on pushes, like requirements-matrix.
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: unity-environment
          path: unity-environment

      - name: Build the third-party inventory
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/third_party_inventory.py report \
            --unity-environment unity-environment \
            --output third-party-inventory
          cat third-party-inventory/inventory.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: third-party-inventory
          path: third-party-inventory
          if-no-files-found: warn

  # Diary of the change: comments the result of the required CI checks on the
  # issues cited by a pull request to test, only when the result changes
  # (first run of the pull request, failed -> passed, passed -> failed).
  # A hidden marker in each comment records pull request and result.
  # Not a required check; issue-links runs in its own workflow.
  issue-diary:
    needs: [smoke-check, spellcheck, requirement-ids, secret-scan, unity-tests, requirements-matrix]
    # Also after a failure, which is what the comment reports. Not when the
    # run is cancelled: a cancelled run has no result.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'test' }}
    runs-on: ubuntu-latest
    # Write access to issues only for this job.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Comment the check result on the cited issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          # Title and body are user input: read them from env, never inline.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Any required job that did not succeed (secret-scan is never
          # skipped on pull requests).
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<< "$NEEDS" \
            | paste -sd ',' - | sed 's/,/, /g')
          short="${HEAD_SHA:0:7}"
          if [ -z "$failed" ]; then
            result="passed"
            text="✅ CI checks passed on #$PR_NUMBER (development → test), commit \`$short\`. [Run]($RUN_URL)"
          else
            result="failed"
            text="❌ CI checks failed on #$PR_NUMBER (development → test), commit \`$short\`: $failed. [Run]($RUN_URL)"
          fi
          marker="<!-- issue-diary pr=$PR_NUMBER result=$result -->"

          echo "### Issue diary: CI checks $result" >> "$GITHUB_STEP_SUMMARY"
          refs=$(bash .github/scripts/pr_issue_refs.sh)
          while read -r n kind; do
            case "$kind" in open|closed) ;; *) continue ;; esac
            # Last result recorded for this pull request on this issue.
            last=$(gh api --paginate "repos/$REPO/issues/$n/comments" \
                --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
              | grep -oE "<!-- issue-diary pr=$PR_NUMBER result=[a-z]+ -->" \
              | tail -n 1 | sed -E 's/.*result=([a-z]+).*/\1/' || true)
            if [ "$last" = "$result" ]; then
              echo "- #$n: still $result, no comment" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            gh api "repos/$REPO/issues/$n/comments" \
              -f body="$(printf '%s\n%s' "$text" "$marker")" > /dev/null
            echo "- #$n: commented ($result)" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$refs"
